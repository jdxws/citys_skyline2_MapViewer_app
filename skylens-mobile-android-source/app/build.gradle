plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.skylens.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.skylens.mobile"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.1.2"
        manifestPlaceholders = [appLabel: "SKYLENS"]
    }

    signingConfigs {
        debug {
            // Keep a local debug key across builds; never commit this file.
            def localKey = rootProject.file('.signing/debug.keystore')
            if (localKey.exists()) storeFile localKey
        }
    }

    buildTypes {
        exportPreview {
            initWith debug
            applicationIdSuffix ".exportpreview"
            versionNameSuffix "-export-preview"
            manifestPlaceholders = [appLabel: "SKYLENS 导出测试版"]
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 本应用没有任何第三方依赖，只使用 Android 系统自带的 API。
