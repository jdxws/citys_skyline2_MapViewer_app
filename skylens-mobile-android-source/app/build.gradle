plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.skylens.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.skylens.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 本应用没有任何第三方依赖，只使用 Android 系统自带的 API。
